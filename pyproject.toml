[project]
name = "ct-metadata-security-research"
version = "2.0.0"
description = "Research prototype for evaluating DICOM metadata tampering detection in brain CT studies"
requires-python = ">=3.10"
dependencies = [
  "pydicom>=3.0.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "streamlit>=1.38",
  "pillow>=10.0",
  "torch>=2.3.0",
  "tabulate>=0.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
